# =====================================================
# NGINX OPTIMIZATION CONFIG for POS Cafe Prototype
# =====================================================
# Copy konfigurasi ini ke file virtual host Nginx Anda di:
# C:\laragon\etc\nginx\sites-enabled\auto.pos-cafe-prototype.test.conf
#
# Atau tambahkan ke dalam block 'server { ... }'
# =====================================================

# Enable Gzip Compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript 
           application/json application/javascript application/xml+rss 
           application/rss+xml application/atom+xml 
           image/svg+xml;
gzip_min_length 256;

# Browser Caching for Static Assets
location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|woff|woff2|ttf|eot|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    # Tambahkan ini jika file tidak ditemukan, coba di build folder
    try_files $uri $uri/ /build/$uri =404;
}

# Don't cache HTML/PHP files
location ~* \.(html|htm|php)$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
}

# Optimize for Vite/Laravel assets in build folder
location /build/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Security Headers (Bonus)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;

# =====================================================
# CARA IMPLEMENTASI:
# =====================================================
# 1. Buka file: C:\laragon\etc\nginx\sites-enabled\auto.pos-cafe-prototype.test.conf
# 2. Copy SEMUA konfigurasi di atas
# 3. Paste di dalam block 'server { ... }' SEBELUM block 'location / { ... }'
# 4. Simpan file
# 5. Restart Nginx dari Laragon Menu
# 6. Test dengan refresh browser (Ctrl+Shift+R untuk hard refresh)
# =====================================================

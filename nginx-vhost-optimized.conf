server {
    listen 8080;
    server_name pos-cafe-prototype.test *.pos-cafe-prototype.test;
    root "C:/laragon/www/pos-cafe-prototype/public";
    index index.html index.htm index.php;
    
    # =========================================
    # GZIP COMPRESSION (Reduce 2.3MB → 600KB)
    # =========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml application/atom+xml 
               image/svg+xml;
    gzip_min_length 256;
    
    # =========================================
    # BROWSER CACHING FOR STATIC ASSETS
    # =========================================
    # Cache CSS, JS, Images, Fonts for 1 year
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri $uri/ =404;
    }
    
    # Optimize for Vite/Laravel build assets
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # =========================================
    # SECURITY HEADERS
    # =========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # =========================================
    # LARAVEL ROUTES
    # =========================================
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
        autoindex on;
    }
    
    # PHP Handler
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass php_upstream;
        #fastcgi_pass unix:/run/php/php7.0-fpm.sock;
        
        # Don't cache PHP responses
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }
    
    # =========================================
    # STANDARD LARAVEL CONFIG
    # =========================================
    charset utf-8;
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~ /\.ht {
        deny all;
    }
}

# Modified for optimization - prefix 'auto.' removed to prevent Laragon auto-regeneration
# To restore default: Menu > Laragon > Nginx > Virtual Hosts > Remove & Re-add
